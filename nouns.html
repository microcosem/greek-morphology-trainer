<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Greek Noun Practice</title>

  <!-- Gentium Plus gives clean polytonic Greek; styles.css has fallback fonts. -->
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Greek Noun Practice</h1>
    <nav class="site-nav"><a href="index.html">&larr; Home</a> &middot; <a href="verbs.html">Verb trainer</a></nav>

    <!-- Running score and streak -->
    <div class="bar">
      <span id="score">0 / 0 correct</span>
      <span id="streak"></span>
    </div>

    <!-- Filters (chips are created by nouns.js) -->
    <div class="label">Question types</div>
    <div class="chips" id="question-chips"></div>
    <div class="label">Declensions</div>
    <div class="chips" id="declension-chips"></div>

    <!-- The flashcard -->
    <div class="card">
      <div class="question" id="question"></div>
      <div class="greek-word" id="word"></div>

      <input type="text" id="answer" placeholder="Type your answer"
             autocomplete="off" autocapitalize="off" spellcheck="false">

      <div class="button-row">
        <button class="btn" id="check-btn">Check</button>
        <button class="btn secondary hidden" id="override-btn">Mark as correct</button>
        <button class="btn hidden" id="next-btn">Next</button>
      </div>

      <!-- Feedback is inserted here after each answer -->
      <div id="result"></div>
    </div>

    <p class="note">Greek answers: accents and breathing marks are required (macrons are optional). Press Enter to check and again to continue.</p>

    <!-- Clears this page's saved score and missed-card history (see resetProgress in the script). -->
    <div class="reset-row">
      <button class="btn danger small" id="reset-btn" type="button">Reset progress</button>
      <span class="note">Clears your score and missed-card history for this page.</span>
    </div>
  </main>

  <!-- data_nouns.js must load before nouns.js (it defines NOUN_DATA). "defer" keeps the order. -->
  <script src="data_nouns.js" defer></script>
  <script src="nouns.js" defer></script>
</body>
</html>
